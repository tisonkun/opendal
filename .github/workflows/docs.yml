name: Docs

on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Apache OpenDAL Docs run supplying API HTML artifacts
        required: true
        default: "34473054039"

permissions:
  contents: read
  actions: read

jobs:
  profile-website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCUSAURUS_PERF_LOGGER: "true"
      RUST_DOC_TOOLCHAIN: nightly-2026-04-30
      RUSTDOCFLAGS: >-
        --cfg docsrs
        -D rustdoc::broken_intra_doc_links
        -D rustdoc::invalid_rust_codeblocks
        -D rustdoc::bare_urls
    defaults:
      run:
        shell: bash
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Corepack
        run: npm install -g --force corepack && corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download API documentation from the reviewed image PR
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: apache/opendal
          run-id: ${{ inputs.artifact-run }}
          pattern: "*-documentation"
          path: website/static/docs/
      - name: Organize documentation
        run: |
          mv static/docs/rust-documentation static/docs/rust
          for binding in java nodejs python ruby c lua haskell cpp ocaml; do
            mv "static/docs/binding-${binding}-documentation" "static/docs/${binding}"
          done
          for integration in object-store dav-server unftp-sbe object-parquet; do
            case "$integration" in
              object-store) directory=object_store ;;
              object-parquet) directory=parquet ;;
              *) directory="$integration" ;;
            esac
            mkdir -p "static/docs/integrations/${directory}/target"
            if [ "$integration" = object-parquet ]; then
              artifact=integration-object-parquet-documentation
            else
              artifact="integration-${integration}-opendal-documentation"
            fi
            mv "static/docs/${artifact}" "static/docs/integrations/${directory}/target/doc"
          done
      - name: Capture native Cargo diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/opendal-profile/bin"
          echo "OPENDAL_REAL_RUSTUP=$(command -v rustup)" >> "$GITHUB_ENV"
          echo "OPENDAL_CARGO_TRACE=$RUNNER_TEMP/opendal-profile/cargo.log" >> "$GITHUB_ENV"
          cp scripts/profile-rustup.py "$RUNNER_TEMP/opendal-profile/bin/rustup"
          chmod +x "$RUNNER_TEMP/opendal-profile/bin/rustup"
          echo "$RUNNER_TEMP/opendal-profile/bin" >> "$GITHUB_PATH"
      - name: First Website build
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/profile-build.cjs" ./node_modules/.bin/docusaurus build 2>&1 | tee "$RUNNER_TEMP/opendal-profile/first-build.log"
          cp build/llms*.txt "$RUNNER_TEMP/opendal-profile/"
      - name: Second Website build
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/profile-build.cjs" ./node_modules/.bin/docusaurus build 2>&1 | tee "$RUNNER_TEMP/opendal-profile/second-build.log"
      - name: Show native Cargo diagnostics
        if: always()
        run: cat "$RUNNER_TEMP/opendal-profile/cargo.log"
      - name: Upload profiling evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-llms-profile
          path: ${{ runner.temp }}/opendal-profile/
